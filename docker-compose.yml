services:

  # PHP
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: php:8.4-fpm
    container_name: app_bth
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./php/php.ini:/usr/local/etc/php/php.ini
    networks:
      - app-network
  #Node
  node:
    image: node:24-alpine
    container_name: node
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    networks:
      - app-network
    tty: true
    # Nginx
  webserver:
    image: nginx:alpine
    container_name: web_bth
    restart: unless-stopped
    tty: true
    ports:
      - "8888:80"
    volumes:
      - ./:/var/www
      - ./nginx/conf.d:/etc/nginx/conf.d
    networks:
      - app-network

  # Postgres
  db_bth:
    image: postgres:16-alpine
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    container_name: db_bth
    restart: unless-stopped
    tty: true
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
    networks:
      - app-network
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: secret
    ports:
      - "5050:80"
    depends_on:
      - db_bth
    networks:
      - app-network
# Docker Networks
networks:
  app-network:
    driver: bridge
